name: check

# The marketplace's own gate: consistency of the plugins (repo-check) and every offline test (run-tests).
# No Unreal Engine on the runner: the tests use fixtures and stand-in processes, never an editor or a build.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: repo-check
        run: node scripts/repo-check.mjs
      - name: offline tests
        run: node scripts/run-tests.mjs
